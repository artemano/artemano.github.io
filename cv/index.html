<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CV de Rafael Ernesto Pino</title>
  <link id="cv-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400..800&amp;family=Newsreader:opsz,wght@6..72,200..700&amp;family=Roboto:wght@100..700&amp;display=swap">
  <style id="cv-css">
    *, *::before, *::after { box-sizing: border-box; }
    .document {
      --accent: #b8632f;
      --rule: #d4a574;
      --ink: #1a1a1a;
      --accent-ink: #fff;
      --accent-pale: #ffdfcc;
      --accent-dark: #7c370d;
      --title-font: "Newsreader", Georgia, serif;
      --body-font: "Roboto", Arial, sans-serif;
      --detail-font: "DM Sans", Arial, sans-serif;
      --border: #e5e5e5;
      --muted: #555;
      --card-fill: #fafafa;
      --card-radius: 6px;
      --tag-radius: 10px;
      --section-tracking: 2.6px;
      --section-gap: 17px;
      width: 816px;
      margin: 0 auto;
      color: var(--ink);
      font: 10.5px/1.45 var(--body-font);
      overflow-wrap: break-word;
    }
    .document[data-style="classic"] {
      --card-fill: #fff;
      --card-radius: 0;
      --tag-radius: 0;
      --section-tracking: 1.7px;
    }
    .document[data-style="minimal"] {
      --card-fill: transparent;
      --card-radius: 0;
      --tag-radius: 3px;
      --section-tracking: 1px;
    }
    .sheet {
      display: flex;
      flex-direction: column;
      width: 816px;
      min-height: 1056px;
      padding: 42px 44px 28px;
      background: #fff;
      text-align: left;
    }
    .sheet + .sheet { margin-top: 26px; }
    .sheet.advisory { --section-gap: 13px; padding: 36px 36px 28px; }
    .sheet h1, .sheet h2, .sheet h3, .sheet p, .sheet ul { margin: 0; }
    .sheet a { color: inherit; text-decoration: none; }
    .sheet a:hover { text-decoration: underline; }
    .cv-header {
      display: grid;
      grid-template-columns: 1fr max-content;
      align-items: start;
      gap: 14px 18px;
      padding-bottom: 15px;
      border-bottom: 1px solid var(--rule);
    }
    .identity h1 {
      font: 500 49px/.98 var(--title-font);
      letter-spacing: -.045em;
    }
    .identity .headline {
      color: var(--accent-dark);
      margin-top: 10px;
      font: 800 9.5px/1.45 var(--detail-font);
      letter-spacing: .085em;
    }
    .contacts {
      display: grid;
      justify-items: end;
      font: 500 10px/1.48 var(--detail-font);
      color: var(--muted);
    }
    .cv-header.centered {
      display: block;
      text-align: center;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 1px var(--rule);
    }
    .cv-header.centered .identity h1 { font-size: 51px; }
    .cv-header.centered .contacts {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      column-gap: 17px;
      margin-top: 12px;
    }
    .cv-header.centered .contacts > * + *::before {
      content: "·";
      display: inline-block;
      margin-right: 15px;
      color: var(--accent);
    }
    .sheet .summary { margin-top: 12px; }
    .advisory .summary {
      max-width: 610px;
      margin-inline: auto;
      text-align: center;
    }
    .metrics {
      display: grid;
      grid-auto-flow: column;
      grid-auto-columns: minmax(0, 1fr);
      align-items: stretch;
      padding: 11px 0 8px;
      margin-top: 15px;
      background: var(--card-fill);
      border-block: 1px solid var(--border);
      text-align: center;
    }
    .metric { padding: 2px 4px; }
    .metric + .metric { border-left: 1px solid var(--border); }
    .metric strong {
      display: block;
      color: var(--accent);
      font: 500 36px/36px var(--title-font);
      letter-spacing: -.035em;
      overflow-wrap: normal;
      white-space: nowrap;
    }
    .metric[data-metric="enterprise_deals"] strong { font-size: calc(36px - 1pt); }
    .metric span {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font: 500 8.5px/1.3 var(--body-font);
      text-transform: uppercase;
      letter-spacing: .05em;
    }
    .advisory .metrics { margin-top: 12px; padding-block: 8px; }
    .cv-section { margin-top: var(--section-gap); }
    .sheet > .cv-section:first-child { margin-top: 0; }
    .cv-section > h2 {
      padding-bottom: 6px;
      margin-bottom: 9px;
      border-bottom: 2px solid var(--accent);
      box-shadow: 0 1px var(--rule);
      font: 700 13.5px/1.15 var(--body-font);
      letter-spacing: var(--section-tracking);
      text-transform: uppercase;
    }
    .document[data-style="classic"] .cv-section > h2,
    .document[data-style="minimal"] .cv-section > h2 {
      border-bottom-width: 1px;
      box-shadow: none;
    }
    .document[data-style="classic"] .cv-section > h2 { font-family: var(--title-font); }
    .document[data-style="minimal"] .cv-section > h2 { border-bottom-color: var(--border); }
    .roles { display: grid; gap: 9px; }
    .role + .role { border-top: 1px solid var(--border); padding-top: 8px; }
    .role-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 2px 10px;
      margin-bottom: 3px;
    }
    .role-head h3 { font: 800 12.5px/1.24 var(--detail-font); }
    .company { font-weight: 650; color: var(--accent-dark); }
    .period { color: var(--muted); font: 500 9.5px/1.35 var(--detail-font); }
    .sheet .role-description { margin-bottom: 4px; color: var(--muted); }
    .sheet ul { list-style: none; padding: 0; }
    .bullets { display: grid; row-gap: 2px; }
    .bullets.columns {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      column-gap: 16px;
    }
    .bullets li { position: relative; padding-left: 11px; }
    .bullets li::before {
      content: "◆";
      position: absolute;
      inset: .44em auto auto 0;
      color: var(--accent);
      font-size: 6px;
    }
    .continued .roles { gap: 7px; }
    .continued .role + .role { padding-top: 7px; }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(var(--columns), minmax(0, 1fr));
      gap: 9px;
    }
    .card {
      border: 1px solid var(--border);
      border-radius: var(--card-radius);
      background: var(--card-fill);
      padding: 9px 11px;
    }
    .document[data-style="minimal"] .card {
      border-width: 1px 0 0;
      padding-inline: 0;
    }
    .card > svg {
      display: block;
      color: var(--accent);
      width: 28px;
      height: 28px;
      margin-bottom: 6px;
    }
    .card h3, .skills h3, .credentials h3 {
      font: 800 11.5px/1.28 var(--detail-font);
      margin-bottom: 3px;
    }
    .card p { font-size: 10.5px; }
    .card .period { margin-bottom: 4px; }
    .service-grid .card { padding-block: 9px; }
    .service-grid .bullets { font-size: 10.5px; }
    .track-grid .card { background: #fff; }
    .tags { display: flex; flex-wrap: wrap; gap: 3px 4px; }
    .tag {
      display: inline-block;
      border: 1px solid transparent;
      border-radius: var(--tag-radius);
      padding: 2px 7px;
      color: var(--accent-ink);
      background: var(--accent);
      font: 600 9px/1.26 var(--detail-font);
      letter-spacing: .02em;
    }
    .tag.secondary { color: var(--accent-dark); background: var(--accent-pale); }
    .document[data-style="minimal"] .tag {
      color: var(--ink);
      background: transparent;
      border-color: var(--border);
    }
    .skills.rows { display: grid; gap: 5px; }
    .skills.rows > div {
      display: grid;
      grid-template-columns: 127px 1fr;
      align-items: baseline;
      column-gap: 8px;
    }
    .skills.rows h3 { margin-bottom: 0; }
    .skills.columns, .credentials {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      column-gap: 12px;
    }
    .skills.columns > div + div, .credentials > div + div {
      padding-left: 12px;
      border-left: 1px solid var(--border);
    }
    .credentials li { font-size: 10px; line-height: 1.35; }
    .credentials li + li { margin-top: 4px; }
    .credentials small { display: block; font: inherit; color: var(--muted); }
    .advisory .card { padding-block: 9px; }
    .document:is(:lang(es), :lang(pt)) .sheet.advisory { --section-gap: 11px; }
    .document:is(:lang(es), :lang(pt)) :is(.advisory, .service-grid) .card { padding-block: 8px; }
    .advisory .credentials li { font-size: 10.5px; }
    .sheet footer {
      display: flex;
      justify-content: flex-end;
      margin-top: auto;
      padding-top: 17px;
      color: var(--muted);
      font: 650 8.5px/1.4 var(--detail-font);
      letter-spacing: .12em;
    }
    .sheet footer span {
      width: 100%;
      border-top: 1px solid var(--rule);
      padding-top: 8px;
      text-align: right;
    }
    .advisory footer span { text-align: center; }
    @page { size: Letter portrait; margin: 0; }
    @media print {
      html, body { width: 8.5in; margin: 0 !important; background: #fff !important; }
      .document {
        zoom: 1 !important;
        margin: 0;
        print-color-adjust: exact;
        -webkit-print-color-adjust: exact;
      }
      .sheet {
        height: 11in;
        min-height: 0;
        width: 8.5in;
        margin: 0 !important;
        box-shadow: none !important;
        break-after: page;
      }
      .sheet:last-child { break-after: auto; }
      .card, .role, .cv-header, .metrics { break-inside: avoid; }
      .cv-section > h2 { break-after: avoid; }
    }
  </style>
  <style>
    :root {
      color-scheme: light;
      --ui-ink: #292623;
      --ui-muted: #625d56;
      --ui-accent: #94491f;
      --ui-border: #e6e0d8;
      font: 14px/1.5 "DM Sans", system-ui, sans-serif;
      color: var(--ui-ink);
      background: #edeae5;
    }
    body { margin: 0; }
    button, select, input { font: inherit; }
    button { cursor: pointer; }
    :focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 3px; }
    .topbar {
      position: sticky;
      z-index: 2;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 13px 26px;
      min-height: 68px;
      border-bottom: 1px solid var(--ui-border);
      background: #fffcf8;
    }
    .brand, .top-actions, .action { display: flex; align-items: center; }
    .brand { gap: 10px; font-size: 16px; font-weight: 800; letter-spacing: -.025em; }
    .brand-mark {
      display: grid;
      place-items: center;
      flex: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: var(--ui-accent);
      background: #f5e7dc;
    }
    .brand-mark svg, .action svg { width: 17px; height: 17px; }
    .top-actions { gap: 8px; }
    .action {
      justify-content: center;
      gap: 8px;
      min-height: 38px;
      border: 1px solid #dcd4cb;
      border-radius: 7px;
      padding: 7px 12px;
      background: transparent;
      color: var(--ui-ink);
      font-weight: 750;
      font-size: 12px;
      white-space: nowrap;
    }
    .action:hover { background: #f1ebe3; }
    .action.primary { border-color: #302b26; color: #fff; background: #302b26; }
    .action.primary:hover { background: #4b4036; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr); align-items: start; }
    .layout.generator { grid-template-columns: 294px minmax(0, 1fr); }
    .settings[hidden], .variants[hidden] { display: none; }
    .settings {
      position: sticky;
      top: 68px;
      min-height: calc(100dvh - 68px);
      max-height: calc(100dvh - 68px);
      overflow: auto;
      background: #fffcf8;
      border-right: 1px solid var(--ui-border);
    }
    .settings summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 23px 20px 12px;
      cursor: pointer;
      list-style: none;
    }
    .settings summary::-webkit-details-marker { display: none; }
    .settings summary svg { width: 16px; height: 16px; color: var(--ui-muted); }
    .settings[open] summary svg { transform: rotate(180deg); }
    .settings-heading { font-size: 17px; font-weight: 800; letter-spacing: -.025em; }
    .settings-content { padding: 0 20px 22px; }
    .setting-group {
      margin: 0 0 16px;
      padding: 13px 0 0;
      border-top: 1px solid var(--ui-border);
    }
    .setting-group h2 {
      margin: 0 0 10px;
      color: var(--ui-ink);
      font-size: 12px;
      font-weight: 800;
    }
    .palette-options {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 5px;
      margin-bottom: 10px;
    }
    .palette {
      display: grid;
      justify-items: center;
      gap: 5px;
      padding: 5px 1px 4px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: var(--ui-muted);
      font-size: 9px;
      font-weight: 750;
    }
    .palette:hover, .palette[aria-pressed="true"] { background: #f4ebe3; }
    .palette[aria-pressed="true"] { border-color: #d2b49e; color: var(--ui-accent); }
    .swatch {
      display: block;
      width: 24px;
      height: 24px;
      border: 1px solid #302b2618;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--swatch-a) 55%, var(--swatch-b) 55%);
    }
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 32px;
      gap: 8px;
      color: var(--ui-muted);
      font-size: 11.5px;
    }
    .color-value { display: flex; align-items: center; gap: 8px; }
    .color-value output { min-width: 49px; font: 10px ui-monospace, monospace; }
    input[type="color"] {
      width: 27px;
      height: 23px;
      padding: 2px;
      border: 1px solid #dcd4cb;
      border-radius: 5px;
      background: #fff;
      cursor: pointer;
    }
    .font-rows { display: grid; gap: 5px; }
    .setting-row select {
      width: 123px;
      min-height: 29px;
      padding: 3px 6px;
      border: 1px solid #dcd4cb;
      border-radius: 5px;
      color: var(--ui-ink);
      background: #fff;
      font-size: 11.5px;
    }
    .style-options, .variants { display: flex; align-items: stretch; gap: 3px; }
    .style-options {
      padding: 3px;
      border: 1px solid var(--ui-border);
      border-radius: 7px;
      background: #f3efe9;
    }
    .style-options button, .variant {
      border: 1px solid transparent;
      border-radius: 5px;
      background: transparent;
      color: var(--ui-muted);
      font-weight: 750;
      white-space: nowrap;
    }
    .style-options button { flex: 1; padding: 4px 2px; font-size: 10.5px; }
    .style-options button:hover, .variant:hover { color: var(--ui-ink); }
    .style-options button[aria-pressed="true"] {
      border-color: #ded4c8;
      background: #fff;
      color: var(--ui-ink);
      box-shadow: 0 1px 2px #352d2210;
    }
    .reset {
      padding: 3px 0;
      border: 0;
      background: none;
      color: var(--ui-accent);
      font-size: 11.5px;
      font-weight: 750;
    }
    .reset:hover { text-decoration: underline; }
    .preview { min-width: 0; padding: 24px 26px 44px; }
    .preview-bar, .preview-frame { max-width: 816px; margin-inline: auto; }
    .preview-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 9px 14px;
      margin-bottom: 16px;
    }
    .variants {
      padding: 4px;
      border: 1px solid #ded7cc;
      border-radius: 8px;
      background: #e5e0d8;
    }
    .variant { padding: 6px 12px; font-size: 12px; }
    .variant[aria-pressed="true"] {
      border-color: #e0d9cf;
      color: #392c22;
      background: #fffcf8;
      box-shadow: 0 1px 2px #352d2214;
    }
    .preview-tools, .language-control {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px 12px;
    }
    .language-control {
      gap: 6px;
      color: var(--ui-muted);
      font-size: 11.5px;
      font-weight: 650;
    }
    .language-control select {
      min-height: 32px;
      padding: 3px 5px;
      border: 1px solid #ded7cc;
      border-radius: 5px;
      color: var(--ui-ink);
      background: #fffcf8;
    }
    .page-info {
      color: var(--ui-muted);
      font-size: 11.5px;
      font-weight: 650;
      white-space: nowrap;
    }
    .preview-frame > .document { zoom: var(--preview-scale, 1); }
    .preview-frame .sheet { box-shadow: 0 1px 2px #32291d20, 0 8px 28px #32291d18; }
    @media (max-width: 850px) {
      .layout { display: block; }
      .settings { position: static; min-height: 0; max-height: none; border: 0; border-bottom: 1px solid var(--ui-border); }
      .settings summary { padding-block: 12px; }
      .settings-content { max-width: 430px; padding-bottom: 14px; }
      .preview { padding: 15px 16px 30px; }
    }
    @media (max-width: 520px) {
      .topbar { padding: 10px 12px; min-height: 56px; }
      .brand { font-size: 13px; gap: 6px; }
      .brand-mark { width: 28px; height: 28px; }
      .top-actions { gap: 5px; }
      .action { gap: 4px; padding: 5px 7px; min-height: 34px; }
      .action svg { width: 14px; height: 14px; }
      .action .long-label { display: none; }
      .settings summary { padding-inline: 14px; }
      .settings-heading { font-size: 14px; }
      .preview { padding-inline: 12px; }
      .variant { padding: 5px 8px; font-size: 11px; }
      .page-info { font-size: 10px; }
    }
    @media print {
      .topbar, .settings, .preview-bar { display: none !important; }
      .layout, .preview, .preview-frame { display: block; padding: 0; margin: 0; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6zM14 3v5h4M9 12h6M9 16h6"/></svg></span>
      <span>CV de Rafael Pino</span>
    </div>
    <div class="top-actions">
      <button id="print" type="button" class="action primary" aria-label="Imprimir o guardar PDF">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8V3h12v5M6 17H3V8h18v9h-3M6 14h12v7H6zM17 11h1"/></svg>
        <span><span class="long-label">Imprimir / </span>PDF</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <details class="settings" open hidden>
      <summary>
        <span class="settings-heading">Personalizar</span>
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
      </summary>
      <div class="settings-content">
        <section class="setting-group" aria-labelledby="palette-label">
          <h2 id="palette-label">Paleta</h2>
          <div class="palette-options" id="palettes" role="group" aria-labelledby="palette-label"></div>
          <label class="setting-row" for="accent">Principal
            <span class="color-value"><output id="accent-value" for="accent"></output><input id="accent" type="color"></span>
          </label>
          <label class="setting-row" for="rule">Secundario
            <span class="color-value"><output id="rule-value" for="rule"></output><input id="rule" type="color"></span>
          </label>
          <label class="setting-row" for="ink">Texto
            <span class="color-value"><output id="ink-value" for="ink"></output><input id="ink" type="color"></span>
          </label>
        </section>
        <section class="setting-group" aria-labelledby="font-label">
          <h2 id="font-label">Tipografía</h2>
          <div class="font-rows">
            <label class="setting-row" for="title-font">Títulos y cifras
              <select id="title-font"><option>Newsreader</option><option>Georgia</option><option>DM Sans</option><option>Roboto</option><option>Arial</option></select>
            </label>
            <label class="setting-row" for="body-font">Cuerpo
              <select id="body-font"><option>Roboto</option><option>DM Sans</option><option>Arial</option><option>Georgia</option><option>Newsreader</option></select>
            </label>
            <label class="setting-row" for="detail-font">Cargos y etiquetas
              <select id="detail-font"><option>DM Sans</option><option>Roboto</option><option>Arial</option><option>Georgia</option><option>Newsreader</option></select>
            </label>
          </div>
        </section>
        <section class="setting-group" aria-labelledby="style-label">
          <h2 id="style-label">Estilo</h2>
          <div class="style-options" role="group" aria-labelledby="style-label">
            <button type="button" data-style="editorial">Editorial</button>
            <button type="button" data-style="classic">Clásico</button>
            <button type="button" data-style="minimal">Minimalista</button>
          </div>
        </section>
        <button type="button" class="reset" id="reset">Restablecer diseño</button>
      </div>
    </details>

    <section class="preview" aria-label="Vista previa del CV">
      <div class="preview-bar">
        <div class="variants" role="group" aria-label="Audiencia del CV" hidden>
          <button class="variant" type="button" data-variant="fulltime">CTO</button>
          <button class="variant" type="button" data-variant="consulting">Consultoría</button>
          <button class="variant" type="button" data-variant="advisory">Asesoría</button>
        </div>

  <script>
    "use strict";

    const { translations, ...source } = JSON.parse(document.querySelector("#cv-data").textContent);
    const cv = document.querySelector("#cv");
    const frame = document.querySelector(".preview-frame");
    const languageControl = document.querySelector("#cv-language");
    const settings = document.querySelector(".settings");
    const generatorMode = new URLSearchParams(window.location.search).get("gen") === "true";

    settings.hidden = !generatorMode;
    document.querySelector(".variants").hidden = !generatorMode;
    document.querySelector(".layout").classList.toggle("generator", generatorMode);

    function localize(base, translation) {
      if (translation === undefined) return base;
      if (translation === null || typeof translation !== "object" || Array.isArray(translation)) return translation;
      if (Array.isArray(base)) return base.map(item => localize(item, translation[item.id]));
      const result = { ...base };
      for (const [key, value] of Object.entries(translation)) result[key] = localize(base?.[key], value);
      return result;
    }

    function escapeHtml(value) {
      const entities = { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" };
      return String(value).replace(/[&<>"']/g, char => entities[char]);
    }

    function formatText(value) {
      return String(value).split(/(<\/?strong>)/gi).map(part =>
        /^<\/?strong>$/i.test(part) ? part.toLowerCase() : escapeHtml(part)
      ).join("");
    }

    function svgIcon(name) {
      const paths = {
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>',
        book: '<path d="M12 6.5C9.3 4 5.6 3.8 2.5 5v14c3.1-1.2 6.8-1 9.5 1.5 2.7-2.5 6.4-2.7 9.5-1.5V5C18.4 3.8 14.7 4 12 6.5zm0 0v14"/>',
        layers: '<path d="m12 3 9 5-9 5-9-5zm-9 9 9 5 9-5M3 16l9 5 9-5"/>',
        "file-text": '<path d="M6 3h8l4 4v14H6zM14 3v5h4m-9 4h6m-6 4h6"/>',
        spiral: '<path d="M12 12c0-1.1-.9-2-2-2s-2 1-2 2.5S9.5 16 12 16s5-2.2 5-5-2.5-6-6-6-8 3-8 7.5S7 21 12 21s9-4 9-9-4-9-9-9"/>'
      };
      return '<svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + paths[name] + '</svg>';
    }

    function header(variant, data) {
      const person = data.personal;
      const phone = person.phone.replace(/[^+\d]/g, "");
      return `<header class="cv-header ${variant === "advisory" ? "centered" : ""}">
        <div class="identity">
          <h1>${escapeHtml(person.name)}</h1>
          <p class="headline">${escapeHtml(data.headlines[variant])}</p>
        </div>
        <div class="contacts">
          <span>${escapeHtml(person.location)}</span>
          <a href="tel:${escapeHtml(phone)}">${escapeHtml(person.phone)}</a>
          <a href="mailto:${escapeHtml(person.email)}">${escapeHtml(person.email)}</a>
          <a href="https://${escapeHtml(person.linkedin)}">${escapeHtml(person.linkedin)}</a>
        </div>
      </header>`;
    }

    function section(title, content, extraClass = "") {
      return `<section class="cv-section ${extraClass}"><h2>${escapeHtml(title)}</h2>${content}</section>`;
    }

    function page(content, footer, extraClass = "") {
      return `<article class="sheet ${extraClass}">${content}<footer><span>${escapeHtml(footer)}</span></footer></article>`;
    }

    function list(items, columns = false) {
      return `<ul class="bullets ${columns ? "columns" : ""}" role="list">${items.map(item => `<li>${formatText(item)}</li>`).join("")}</ul>`;
    }

    function metrics(items, values, labels) {
      return `<div class="metrics">${items.map(key => `
        <div class="metric" data-metric="${escapeHtml(key)}"><strong>${escapeHtml(values[key])}</strong><span>${escapeHtml(labels[key])}</span></div>
      `).join("")}</div>`;
    }

    function roles(ids, experience, columns = false) {
      const items = ids.map(id => {
        const role = experience[id];
        return `<article class="role">
          <div class="role-head">
            <h3>${escapeHtml(role.title)} <span class="company">· ${escapeHtml(role.company)}</span></h3>
            <span class="period">${escapeHtml(role.period)}${role.location ? " · " + escapeHtml(role.location) : ""}</span>
          </div>
          ${role.description ? `<p class="role-description">${formatText(role.description)}</p>` : ""}
          ${list(role.bullets, columns)}
        </article>`;
      });
      return `<div class="roles">${items.join("")}</div>`;
    }

    function cards(items, columns, extraClass = "") {
      return `<div class="card-grid ${extraClass}" style="--columns:${columns}">
        ${items.map(item => `<article class="card">
          ${item.icon ? svgIcon(item.icon) : ""}
          <h3>${escapeHtml(item.title)}</h3>
          ${item.period ? `<p class="period">${escapeHtml(item.period)}</p>` : ""}
          ${item.description ? `<p>${formatText(item.description)}</p>` : ""}
          ${item.bullets ? list(item.bullets) : ""}
        </article>`).join("")}
      </div>`;
    }

    function methods(data, advisory = false) {
      const items = data.methodologies
        .filter(method => !advisory || method.id !== "etask_hydra")
        .map(method => ({
          title: method.name,
          icon: method.icon,
          description: method.description ?? `${method.title} · ${method.languages.join(" / ")}`
        }));
      return cards(items, items.length, "method-grid");
    }

    function chips(primary, secondary = []) {
      const filled = primary.map(tag => `<span class="tag">${escapeHtml(tag)}</span>`);
      const tinted = secondary.map(tag => `<span class="tag secondary">${escapeHtml(tag)}</span>`);
      return `<div class="tags">${filled.concat(tinted).join("")}</div>`;
    }

    function skills(data, labels, consulting = false) {
      const groups = consulting
        ? [["architecture"], ["ai_assisted", "ai_engineering"], ["cloud", "platform"]]
        : [["ai_assisted"], ["architecture"], ["cloud"], ["leadership"], ["soft"]];
      const items = groups.map(([key, label = key]) =>
        `<div><h3>${escapeHtml(labels[label])}</h3>${chips(data.skills[key].primary, data.skills[key].secondary)}</div>`);
      return `<div class="skills ${consulting ? "columns" : "rows"}">${items.join("")}</div>`;
    }

    function credentials(data, labels, advisory = false) {
      const education = data.education.map(item => [item.degree, `${item.institution} · ${item.year}`]);
      const certifications = data.certifications.map(item => [item.name, `${item.issuer} · ${item.year}`]);
      const languages = data.personal.languages.map(item => [item.language, item.level]);
      const groups = advisory
        ? [["", [education[0]]], ["", [education[1]]], ["", [certifications[2]]]]
        : [[labels.education, education], [labels.certifications, certifications], [labels.languages, languages]];
      return `<div class="credentials">${groups.map(([title, items]) => `
        <div>
          ${title ? `<h3>${escapeHtml(title)}</h3>` : ""}
          <ul role="list">${items.map(([name, detail]) => `
            <li><strong>${escapeHtml(name)}</strong><small>${escapeHtml(detail)}</small></li>
          `).join("")}</ul>
        </div>`).join("")}</div>`;
    }

    function engagements(experience, descriptions, advisory = false) {
      return cards(Object.entries(descriptions).map(([id, description]) => {
        const role = experience[id];
        return {
          title: role.company,
          period: advisory ? `${role.title} · ${role.period}` : role.period,
          description
        };
      }), 2, "track-grid");
    }

    const variantFilenames = { fulltime: "CTO", consulting: "Consulting", advisory: "Advisory" };

    function renderPages(variant, locale) {
      const data = localize(source, locale.content);
      const experience = Object.fromEntries(data.experience.map(role => [role.id, role]));
      const { labels } = locale;
      const { sections } = labels;

      function intro(highlights) {
        return header(variant, data)
          + `<p class="summary">${formatText(data.summaries[variant])}</p>`
          + metrics(highlights, data.metrics, labels.metrics);
      }

      const layouts = {
        fulltime: () => [
          intro(["delivery_speed_ai", "bug_reduction", "integration_speed_sdd", "engineers_at_peak", "enterprise_deals"])
            + section(sections.experience, roles(["r5", "dvp", "ubanku", "asesoftware", "togroow"], experience, true)),
          section(sections.experience_continued, roles(["digitalware", "globant", "etask", "heinsohn", "unisys"], experience), "continued")
            + section(sections.thought_leadership, methods(data))
            + section(sections.skills, skills(data, labels.skills))
            + section(sections.credentials, credentials(data, labels.credentials))
        ],
        consulting: () => [
          intro(["delivery_speed_ai", "integration_speed_sdd", "engineers_scaled", "enterprise_deals"])
            + section(sections.methodologies, methods(data))
            + section(sections.services, cards(data.consulting_services, 2, "service-grid"))
            + section(sections.clients, chips(data.select_clients, data.industries)),
          section(sections.engagements, engagements(experience, locale.engagements))
            + section(sections.engagement_model, cards(data.engagement_models, data.engagement_models.length))
            + section(sections.skills, skills(data, labels.skills, true))
            + section(sections.consulting_credentials, credentials(data, labels.credentials))
        ],
        advisory: () => [
          intro(["engineers_scaled", "enterprise_deals", "delivery_speed_ai", "companies_founded"])
            + section(sections.advisory_value, cards(data.advisory_value, 3))
            + section(sections.executive_track_record, engagements(experience, locale.advisory_engagements, true))
            + section(sections.intellectual_property, methods(data, true))
            + section(sections.advisory_credentials, credentials(data, labels.credentials, true))
        ]
      };

      const pages = layouts[variant]();
      if (variant === "advisory") return [page(pages[0], labels.advisory_footer, "advisory")];
      return pages.map((body, index) =>
        page(body, labels.pagination.replace("{page}", index + 1).replace("{total}", pages.length)));
    }

    const palettes = {
      Terracota: { accent: "#b8632f", rule: "#d4a574", ink: "#1a1a1a" },
      Océano: { accent: "#28577a", rule: "#83b7c7", ink: "#17232e" },
      Bosque: { accent: "#35634f", rule: "#98ab7d", ink: "#1f2c26" },
      Grafito: { accent: "#494851", rule: "#a7a3ae", ink: "#202024" }
    };
    const fontFamilies = {
      Newsreader: '"Newsreader", Georgia, serif',
      Roboto: '"Roboto", Arial, sans-serif',
      "DM Sans": '"DM Sans", Arial, sans-serif',
      Georgia: "Georgia, serif",
      Arial: "Arial, sans-serif"
    };
    const styles = ["editorial", "classic", "minimal"];
    const defaults = {
      variant: "fulltime", language: "en", style: "editorial", ...palettes.Terracota,
      "title-font": "Newsreader", "body-font": "Roboto", "detail-font": "DM Sans"
    };
    const colors = ["accent", "rule", "ink"];
    const fonts = ["title-font", "body-font", "detail-font"];
    const storageKey = "rafael-pino-cv-v1";
    const state = { ...defaults };

    try {
      const saved = JSON.parse(localStorage.getItem(storageKey)) ?? {};
      if (Object.hasOwn(variantFilenames, saved.variant)) state.variant = saved.variant;
      if (Object.hasOwn(translations, saved.language)) state.language = saved.language;
      if (styles.includes(saved.style)) state.style = saved.style;
      for (const key of colors) if (/^#[0-9a-f]{6}$/i.test(saved[key])) state[key] = saved[key];
      for (const key of fonts) if (Object.hasOwn(fontFamilies, saved[key])) state[key] = saved[key];
    } catch {
      // The editor also works when local storage is unavailable.
    }

    function save() {
      try {
        localStorage.setItem(storageKey, JSON.stringify(state));
      } catch {
        // Keep using the current settings for this session.
      }
    }

    document.querySelector("#palettes").innerHTML = Object.entries(palettes).map(([name, palette]) => `
      <button type="button" class="palette" data-palette="${name}">
        <span class="swatch" aria-hidden="true" style="--swatch-a:${palette.accent};--swatch-b:${palette.rule}"></span>${name}
      </button>`).join("");

    function setPressed(selector, key, value) {
      for (const button of document.querySelectorAll(selector)) {
        button.setAttribute("aria-pressed", button.dataset[key] === value);
      }
    }

    function contrastText(hex) {
      const channels = [1, 3, 5].map(index => parseInt(hex.slice(index, index + 2), 16) / 255);
      const [r, g, b] = channels.map(value =>
        value <= .04045 ? value / 12.92 : ((value + .055) / 1.055) ** 2.4);
      return .2126 * r + .7152 * g + .0722 * b > .179 ? "#1a1a1a" : "#fff";
    }

    function applyDesign() {
      cv.dataset.style = state.style;
      setPressed(".style-options button", "style", state.style);

      for (const key of colors) {
        document.getElementById(key).value = state[key];
        document.getElementById(key + "-value").value = state[key].toUpperCase();
        cv.style.setProperty("--" + key, state[key]);
      }
      const defaultAccent = state.accent === palettes.Terracota.accent;
      cv.style.setProperty("--accent-ink", defaultAccent ? "#fff" : contrastText(state.accent));
      cv.style.setProperty("--accent-pale", defaultAccent ? "#ffdfcc" : "color-mix(in srgb, var(--accent) 17%, white)");
      cv.style.setProperty("--accent-dark", defaultAccent ? "#7c370d" : "color-mix(in srgb, var(--accent) 63%, black)");
      const activePalette = Object.keys(palettes).find(name => colors.every(key => palettes[name][key] === state[key]));
      setPressed(".palette", "palette", activePalette);

      for (const key of fonts) {
        document.getElementById(key).value = state[key];
        cv.style.setProperty("--" + key, fontFamilies[state[key]]);
      }
    }

    function renderVariant() {
      const locale = translations[state.language];
      const pages = renderPages(state.variant, locale);
      cv.lang = locale.lang;
      languageControl.value = state.language;
      cv.innerHTML = pages.join("");
      setPressed(".variant", "variant", state.variant);
      document.querySelector("#page-info").textContent = pages.length === 1 ? "Carta · 1 página" : "Carta · 2 páginas";
      document.title = `${source.personal.name} - ${locale.labels.variant_names[state.variant]} (${state.language.toUpperCase()})`;
    }

    for (const button of document.querySelectorAll(".variant")) {
      button.addEventListener("click", () => {
        state.variant = button.dataset.variant;
        renderVariant();
        save();
        window.scrollTo(0, 0);
      });
    }
    languageControl.addEventListener("change", () => {
      state.language = languageControl.value;
      renderVariant();
      save();
    });
    for (const button of document.querySelectorAll(".palette")) {
      button.addEventListener("click", () => {
        Object.assign(state, palettes[button.dataset.palette]);
        applyDesign();
        save();
      });
    }
    for (const button of document.querySelectorAll(".style-options button")) {
      button.addEventListener("click", () => {
        state.style = button.dataset.style;
        applyDesign();
        save();
      });
    }
    for (const key of colors.concat(fonts)) {
      const control = document.getElementById(key);
      control.addEventListener(colors.includes(key) ? "input" : "change", () => {
        state[key] = control.value;
        applyDesign();
        save();
      });
    }
    document.querySelector("#reset").addEventListener("click", () => {
      Object.assign(state, { ...defaults, variant: state.variant, language: state.language });
      applyDesign();
      save();
    });

    document.querySelector("#print").addEventListener("click", async () => {
      await Promise.race([document.fonts.ready, new Promise(resolve => setTimeout(resolve, 1800))]);
      window.print();
    });


    function scalePreview() {
      frame.style.setProperty("--preview-scale", Math.min(1, frame.clientWidth / 816));
    }

    if (matchMedia("(max-width: 850px)").matches) settings.open = false;
    applyDesign();
    renderVariant();
    scalePreview();
    new ResizeObserver(scalePreview).observe(frame);
  </script>
</body>
</html>
